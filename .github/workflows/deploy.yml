name: Check and deploy GitHub Pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  ASTRO_TELEMETRY_DISABLED: 1

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Upload static Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.PAGES_LAUNCH_APPROVED == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    # Enable only after business content and commercial hosting eligibility are approved.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.PAGES_LAUNCH_APPROVED == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
